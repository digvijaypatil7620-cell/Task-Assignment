<div class="container mt-4">

  <!-- Dashboard Cards -->

  <div class="row mb-4">

    <div class="col-md-4">

      <div class="card shadow border-0 bg-primary text-white">

        <div class="card-body text-center">

          <h1>👨‍🎓</h1>

          <h3>{{ totalStudents$ | async }}</h3>

          <p>Total Students</p>

        </div>

      </div>

    </div>

    <div class="col-md-4">

      <div class="card shadow border-0 bg-success text-white">

        <div class="card-body text-center">

          <h1>📚</h1>

          <h3>{{ totalCourses$ | async }}</h3>

          <p>Total Courses</p>

        </div>

      </div>

    </div>

    <div class="col-md-4">

      <div class="card shadow border-0 bg-warning">

        <div class="card-body text-center">

          <h1>🌍</h1>

          <h3>{{ totalCities$ | async }}</h3>

          <p>Total Cities</p>

        </div>

      </div>

    </div>

  </div>

  <!-- Student List -->

  <div class="card shadow">

    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">

      <h4 class="mb-0">

        👨‍🎓 Student List

      </h4>

      <button
        class="btn btn-light btn-sm"
        (click)="toggleStudents()">

        {{ showStudents ? 'Hide Students' : 'Show Students' }}

      </button>

    </div>

    <div class="card-body">

      <div class="row mb-3">

        <div class="col-md-6">

          <input
            type="text"
            class="form-control"
            placeholder="🔍 Search Student">

        </div>

        <div class="col-md-6 text-end">

          <a
            routerLink="/student-form"
            class="btn btn-success">

            ➕ Add Student

          </a>

        </div>

      </div>

      <div *ngIf="showStudents">

        <div class="row">

          <div
            class="col-lg-4 col-md-6 mb-4"
            *ngFor="let student of students$ | async">

            <app-student-card
              [student]="student"
              (viewStudent)="viewStudent($event)">
            </app-student-card>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- Selected Student -->

  <div
    class="card shadow mt-4 border-success"
    *ngIf="selectedStudentId">

    <div class="card-header bg-success text-white">

      <h4>

        ✅ Selected Student

      </h4>

    </div>

    <div class="card-body">

      <h5>

        Student ID : {{ selectedStudentId }}

      </h5>

      <p>

        This data came from the Child Component using <strong>@Output</strong>.

      </p>

    </div>

  </div>

</div>
