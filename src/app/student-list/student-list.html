<div class="container mt-5">
  <h2 class="text-primary">Student List</h2>

  <button
    class="btn btn-primary mb-3"
    (click)="toggleStudents()">

    {{ showStudents ? 'Hide Students' : 'Show Students' }}

  </button>

  <div *ngIf="showStudents">

    <table class="table table-bordered table-striped">

      <thead class="table-dark">

        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Course</th>
          <th>City</th>
          <th>Action</th> <!-- New Column -->
        </tr>

      </thead>

      <tbody>

        <tr *ngFor="let student of students$ | async">

          <td>{{ student.id }}</td>
          <td>{{ student.name | capitalize }}</td>
          <td>{{ student.course }}</td>
          <td>{{ student.city }}</td>

          <td>
            <a
              [routerLink]="['/student-details', student.id]"
              class="btn btn-success btn-sm">
              View
            </a>
          </td>

        </tr>

      </tbody>

    </table>

  </div>
</div>
