
<div class="container mt-5">
    <div class="card-shadow">
       <div class="card-header bg-primary text-white">
        <h3>
            College Login 
        </h3>
       </div>
       <div class="card-body">

        <form (ngSubmit)="login()">
         <div class="mb-3">
            <label>Email</label>
            <input class="form-control"
            [(ngModel)]="user.email"
            name="email">
         </div>
         <div class="mb-3">
            <label>Password</label>
            <input type="password"
            class="form-control"
            [(ngModel)]="user.password"
            name="password">
         </div>
         <button class="btn btn-success w-100">
            Login
         </button>
        </form> 
         <div class="alert alert-danger mt-3"
         *ngIf="error">
          {{error}}
         </div>
       </div>
    </div>

</div>
