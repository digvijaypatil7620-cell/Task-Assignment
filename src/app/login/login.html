<div class="login-container">

   <div class="login-card">

      <div class="text-center mb-4">

         <div class="college-logo">

            🎓

         </div>

         <h2>D P Patil College</h2>

         <p class="text-muted">
            College Management System
         </p>

      </div>

      <form (ngSubmit)="login()">

         <div class="input-group mb-3">

            <span class="input-group-text">

               <i class="bi bi-envelope-fill"></i>

            </span>

            <input type="email" class="form-control custom-input" placeholder="College Email" [(ngModel)]="user.email"
               name="email">

         </div>

         <div class="input-group mb-4">

            <span class="input-group-text">

               <i class="bi bi-lock-fill"></i>

            </span>

            <input type="password" class="form-control custom-input" placeholder="Password" [(ngModel)]="user.password"
               name="password">

         </div>

         <button class="btn login-btn w-100">

            🔐 {{ 'LOGIN' | translate }}

         </button>

      </form>

      <div class="alert alert-danger mt-4" *ngIf="error">

         {{ error }}

      </div>


   </div>

</div>
